        }, { passive: true });

        // ============================================================
        // ANIMATION LOOP & MULTI-LEVEL TRANSITIONS
        // ============================================================
        const progressBar = document.getElementById('progress-bar');
        const clock = new THREE.Clock();

        function animate() {
            const dt = Math.min(clock.getDelta(), 0.05);
            const elapsedTime = clock.getElapsedTime();

            // Smooth level interpolation
            levelProgress += (targetLevelProgress - levelProgress) * Math.min(1, SMOOTH * dt);

            // Level 3 3D circular carousel rotation inertia
            if (!isDragging) {
                targetGalleryAngle += galleryAngleVelocity;
                galleryAngleVelocity *= 0.90;
            }
            galleryAngle += (targetGalleryAngle - galleryAngle) * Math.min(1, 8.0 * dt);

            // Card hover detection
            const currentHover = checkCardHover();
            if (currentHover !== hoveredCard) {
                hoveredCard = currentHover;
            }
            canvas.classList.toggle('pointer', !!hoveredCard);

            // 1. Particle Nodes visibility, size & movement across levels
            // Level 1: Fully visible heart nodes (size: 0.44, opacity: 1.0)
            // Level 2: Expansive 3D volumetric constellation (size: 0.40, opacity: 0.85)
            // Level 3: Fills the space with small light nodes like Level 4 (size: 0.23, opacity: 0.58)
            // Level 4: Dreamy romantic starfield (size: 0.21, opacity: 0.45)
            let nodeAlpha = 1.0;
            let nodeSize = NODE_BASE_SIZE;

            if (levelProgress <= 1.0) {
                nodeAlpha = THREE.MathUtils.lerp(1.0, 0.85, levelProgress);
                nodeSize = THREE.MathUtils.lerp(NODE_BASE_SIZE, NODE_BASE_SIZE * 0.90, levelProgress);
            } else if (levelProgress <= 2.0) {
                const frac = levelProgress - 1.0;
                nodeAlpha = THREE.MathUtils.lerp(0.85, 0.58, frac);
                nodeSize = THREE.MathUtils.lerp(NODE_BASE_SIZE * 0.90, NODE_BASE_SIZE * 0.52, frac);
            } else {
                const frac = levelProgress - 2.0;
                nodeAlpha = THREE.MathUtils.lerp(0.58, 0.45, frac);
                nodeSize = THREE.MathUtils.lerp(NODE_BASE_SIZE * 0.52, NODE_BASE_SIZE * 0.46, frac);
            }

            nodeGroup.visible = true;
            for (let i = 0; i < NODE_COUNT; i++) {
                const node = nodes[i];
                node.sprite.material.opacity = nodeAlpha;
                let px, py, pz;

                if (levelProgress <= 1.0) {
                    px = THREE.MathUtils.lerp(node.posHeart.x, node.posScatterLevel2.x, levelProgress);
                    py = THREE.MathUtils.lerp(node.posHeart.y, node.posScatterLevel2.y, levelProgress);
                    pz = THREE.MathUtils.lerp(node.posHeart.z, node.posScatterLevel2.z, levelProgress);
                } else if (levelProgress <= 2.0) {
                    const frac = levelProgress - 1.0;
                    px = THREE.MathUtils.lerp(node.posScatterLevel2.x, node.posLine.x, frac);
                    py = THREE.MathUtils.lerp(node.posScatterLevel2.y, node.posLine.y, frac);
                    pz = THREE.MathUtils.lerp(node.posScatterLevel2.z, node.posLine.z, frac);
                } else {
                    const frac = levelProgress - 2.0;
                    px = THREE.MathUtils.lerp(node.posLine.x, node.posStarfield.x, frac);
                    py = THREE.MathUtils.lerp(node.posLine.y, node.posStarfield.y, frac);
                    pz = THREE.MathUtils.lerp(node.posLine.z, node.posStarfield.z, frac);
                }

                node.sprite.position.set(px, py, pz);

                // In Level 3 & Level 4: small light nodes with subtle twinkling
                if (levelProgress > 1.2) {
                    const twinkle = 1.0 + Math.sin(elapsedTime * 2.5 + node.phase) * 0.18;
                    const s = nodeSize * twinkle;
                    node.sprite.scale.set(s, s, 1);
                } else {
                    node.sprite.scale.set(nodeSize, nodeSize, 1);
                }
            }

            // 2. Update Image Cards across levels
            for (let k = 0; k < CARD_COUNT; k++) {
                const card = imageCards[k];
                const isHov = card === hoveredCard;

                let targetX, targetY, targetZ;
                const bob = Math.sin(elapsedTime * 2.5 + card.bobPhase) * 0.15;
                const l1Pos = card.posLevel1;
                const l2Pos = card.posLevel2;

                // Level 3: 3D circular ring carousel (auto-scaled without overlay)
                const theta = (k / CARD_COUNT) * Math.PI * 2 + galleryAngle;
                const circleX = Math.sin(theta) * CIRCLE_RADIUS;
                const circleZ = CIRCLE_CENTER_Z + Math.cos(theta) * CIRCLE_RADIUS;
                const circleY = Math.sin(elapsedTime * 2.0 + k * 0.45) * 0.09;

                const isMob = window.innerWidth < 768;
                const l2Base = isMob ? 1.08 : 0.85;
                const l2Hov  = isMob ? 1.40 : 1.20;
                const l3Base = isMob ? 2.05 : 1.65;
                const l3Hov  = isMob ? 2.50 : 2.10;

                if (levelProgress <= 1.0) {
                    targetX = THREE.MathUtils.lerp(l1Pos.x, l2Pos.x, levelProgress);
                    targetY = THREE.MathUtils.lerp(l1Pos.y, l2Pos.y, levelProgress) + bob * levelProgress;
                    targetZ = THREE.MathUtils.lerp(l1Pos.z, l2Pos.z, levelProgress);
                    // Scale fades in smoothly between Level 1 and Level 2
                    const l2Frac = Math.max(0, (levelProgress - 0.10) / 0.90);
                    card.targetScale = l2Frac * (isHov ? l2Hov : l2Base);
                } else if (levelProgress <= 2.0) {
                    const frac = THREE.MathUtils.smoothstep(levelProgress, 1.0, 2.0);
                    targetX = THREE.MathUtils.lerp(l2Pos.x, circleX, frac);
                    targetY = THREE.MathUtils.lerp(l2Pos.y, circleY, frac) + bob * (1 - frac);
                    targetZ = THREE.MathUtils.lerp(l2Pos.z, circleZ, frac);
                    // Smoothly scale between Level 2 and Level 3
                    const baseScale = THREE.MathUtils.lerp(l2Base, l3Base, frac);
                    const hovScale = THREE.MathUtils.lerp(l2Hov, l3Hov, frac);
                    card.targetScale = isHov ? hovScale : baseScale;
                } else {
                    // Level 4: Scale down and fade away
                    const frac = levelProgress - 2.0;
                    targetX = circleX;
                    targetY = circleY - frac * 5;
                    targetZ = circleZ - frac * 14;
                    card.targetScale = Math.max(0.0001, (l3Base - frac * 2.2));
                }

                card.mesh.position.set(targetX, targetY, targetZ);
                card.currentScale += (card.targetScale - card.currentScale) * Math.min(1, 10 * dt);
                card.mesh.scale.set(card.currentScale, card.currentScale, 1);

                // Card orientation:
                // Level 1-2: flat relative to heart
                // Level 3: elegant tangent curve along circle facing viewer
                let baseRotY = 0;
                const normAngle = Math.atan2(Math.sin(theta), Math.cos(theta));
                if (levelProgress <= 1.0) {
                    baseRotY = 0;
                } else if (levelProgress <= 2.0) {
                    const frac = THREE.MathUtils.smoothstep(levelProgress, 1.0, 2.0);
                    baseRotY = THREE.MathUtils.lerp(0, normAngle, frac);
                } else {
                    baseRotY = normAngle;
                }

                card.mesh.rotation.set(0, baseRotY, 0);
            }

            // 3. Update Halo & Dust opacities
            // Halo and bottom falling sparkles are only active in Level 1 heart,
            // fading away smoothly before Level 2 so Level 2 is purely scattered nodes and memories
            const heartAtmosphere = Math.max(0, 1.0 - levelProgress * 1.6);
            haloMaterial.opacity = 0.70 * heartAtmosphere;

            const dustAlpha = 0.55 * heartAtmosphere;
            dustMaterial.opacity = dustAlpha;

            if (dustAlpha > 0.01) {
                const dustPosAttr = dustGeometry.attributes.position;
                const dustPosArr = dustPosAttr.array;
                for (let i = 0; i < DUST_COUNT; i++) {
                    const d = dustData[i];
                    d.y -= d.vy * dt;
                    const sway = Math.sin(elapsedTime * d.swaySpeed + d.phase) * d.swayAmp;
                    if (d.y < -26 * scaleFac) {
                        d.y = (-16.5 - CY) * scaleFac + Math.random() * 0.5;
                        d.x = (Math.random() - 0.5) * 4.0 * scaleFac;
                    }
                    dustPosArr[i * 3 + 0] = d.x + sway;
                    dustPosArr[i * 3 + 1] = d.y;
                    dustPosArr[i * 3 + 2] = d.z;
                }
                dustPosAttr.needsUpdate = true;
            }

            // 4. Drag momentum & scene rotation
            if (!isDragging) {
                nodeGroup.rotation.y += rotVelocity.y;
                nodeGroup.rotation.x = Math.max(-1.15, Math.min(1.15, nodeGroup.rotation.x + rotVelocity.x));
                rotVelocity.y *= 0.92;
                rotVelocity.x *= 0.92;

                // Ambient drift in Level 1 & 2
                if (levelProgress < 1.3) {
                    nodeGroup.rotation.y += dt * 0.03;
                }

                // In Level 3, the card circle gently rotates continuously like a 3D carousel
                if (levelProgress > 1.5 && levelProgress < 2.5) {
                    targetGalleryAngle += dt * (1.24 / CIRCLE_RADIUS);
                }
            }

            // The card circle rotates in 3D with the scene across all levels
            cardGroup.rotation.copy(nodeGroup.rotation);

            updateCamera(dt);

            // 5. Update Level UI
            const activeLevelIndex = Math.min(3, Math.round(levelProgress));
            levelBtns.forEach((btn, idx) => {
                btn.classList.toggle('active', idx === activeLevelIndex);
            });

            levelSubtitle.textContent = LEVEL_META[activeLevelIndex].name;
            levelHint.innerHTML = LEVEL_META[activeLevelIndex].hint;
            progressBar.style.width = `${((levelProgress / 3.0) * 100).toFixed(1)}%`;

            // Level 4 Letters container visibility
            lettersContainer.classList.toggle('active', levelProgress >= 2.6);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.__heart = {
            nodes,
            imageCards,
            get currentLevel() { return currentLevel; },
            get levelProgress() { return levelProgress; },
            goToLevel,
            setTargetLevel,
            handleScrollStep,
            setTheme,
            rotateGallery: (rad) => { targetGalleryAngle = galleryAngle = rad; },
            openLightbox,
            closeLightbox,
            getCardAtClientPoint,
        };
    </script>
</body>
